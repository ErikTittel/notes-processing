[project]
name = "notes-processing"
version = "0.1.0"
description = "Merge OneNote sections into pages in a new notebook"
requires-python = ">=3.14,<3.15"
dependencies = ["comtypes"]

[project.scripts]
notes-processing = "notes_processing.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes_processing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["onenote: needs the OneNote desktop app and creates a throwaway notebook"]
addopts = "-m 'not onenote'"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".specify", ".claude"]
